<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>
    
    <!-- Tech pattern -->
    <pattern id="techPattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="2" fill="white" fill-opacity="0.1" />
      <rect x="18" y="18" width="4" height="4" fill="white" fill-opacity="0.05" />
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)" />
  <rect width="1200" height="630" fill="url(#techPattern)" />
  
  <!-- Decorative elements -->
  <circle cx="200" cy="150" r="100" fill="white" fill-opacity="0.1" />
  <circle cx="1000" cy="480" r="150" fill="white" fill-opacity="0.1" />
  <circle cx="300" cy="500" r="80" fill="white" fill-opacity="0.08" />
  <circle cx="900" cy="100" r="120" fill="white" fill-opacity="0.08" />
  
  <!-- Tech icons -->
  <g transform="translate(200, 200)" fill="white" fill-opacity="0.15">
    <rect x="-20" y="-20" width="40" height="40" rx="5" />
    <circle cx="0" cy="0" r="15" />
  </g>
  
  <g transform="translate(1000, 400)" fill="white" fill-opacity="0.15">
    <path d="M-20,-20 L20,-20 L0,20 Z" />
    <rect x="-10" y="-10" width="20" height="20" />
  </g>
  
  <!-- Binary code pattern -->
  <text x="50" y="100" font-family="monospace" font-size="14" fill="white" fill-opacity="0.2">
    10101010 01010101 10101010 01010101
  </text>
  <text x="50" y="130" font-family="monospace" font-size="14" fill="white" fill-opacity="0.2">
    01010101 10101010 01010101 10101010
  </text>
  <text x="1000" y="500" font-family="monospace" font-size="14" fill="white" fill-opacity="0.2">
    11001100 00110011 11001100 00110011
  </text>
  <text x="1000" y="530" font-family="monospace" font-size="14" fill="white" fill-opacity="0.2">
    00110011 11001100 00110011 11001100
  </text>
  
  <!-- Circuit lines -->
  <path d="M100,200 L300,200 L300,400 L100,400 Z" stroke="white" stroke-width="2" fill="none" stroke-opacity="0.1" />
  <path d="M900,200 L1100,200 L1100,400 L900,400 Z" stroke="white" stroke-width="2" fill="none" stroke-opacity="0.1" />
  
  <!-- Main content -->
  <g transform="translate(600, 315)">
    <!-- Book icon with enhanced design -->
    <path d="M-100,-50 L-100,50 L100,50 L100,-50 Z" fill="white" fill-opacity="0.9" />
    <path d="M-100,-50 L-100,50 M-50,-50 L-50,50 M0,-50 L0,50 M50,-50 L50,50 M100,-50 L100,50" 
          stroke="white" stroke-width="2" fill="none" />
    <circle cx="0" cy="0" r="20" fill="white" fill-opacity="0.7" />
    
    <!-- Title with shadow effect -->
    <text x="0" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white">
      ICT Textbook
    </text>
    
    <!-- Subtitle with enhanced styling -->
    <text x="0" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" fill="white">
      JSS1 - SS3
    </text>
    
    <!-- Author with decorative underline -->
    <text x="0" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="white" fill-opacity="0.8">
      By Patotec Software Solutions
    </text>
    <line x1="-150" y1="230" x2="150" y2="230" stroke="white" stroke-width="1" stroke-opacity="0.3" />
  </g>
  
  <!-- Bottom text with enhanced styling -->
  <text x="600" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="white" fill-opacity="0.7">
    Comprehensive ICT Curriculum for Secondary Schools
  </text>
  
  <!-- Decorative corner elements -->
  <path d="M0,0 L50,0 L0,50 Z" fill="white" fill-opacity="0.1" />
  <path d="M1200,0 L1150,0 L1200,50 Z" fill="white" fill-opacity="0.1" />
  <path d="M0,630 L50,630 L0,580 Z" fill="white" fill-opacity="0.1" />
  <path d="M1200,630 L1150,630 L1200,580 Z" fill="white" fill-opacity="0.1" />
</svg> 